[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "arq>=0.28",
    "asyncpg>=0.30",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
