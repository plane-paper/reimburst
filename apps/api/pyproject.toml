[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "mypy>=1.14",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
